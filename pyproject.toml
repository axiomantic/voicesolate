[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voicesolate"
version = "0.3.0"
description = "Automated Character Dialogue Extraction, Studio Audio Isolation & End-to-End TTS Voice Training (Piper, XTTS, F5-TTS)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "deepfilternet>=0.5.6",
    "demucs>=4.0.1",
    "faster-whisper>=1.0.0",
    "numpy>=1.26.0",
    "questionary>=2.0.0",
    "rapidfuzz>=3.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "soundfile>=0.12.1",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
]

[project.scripts]
voicesolate = "voicesolate.cli:main"
extract-voice = "voicesolate.cli:main"

[tool.setuptools.packages.find]
include = ["voicesolate*"]
