[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    unit: Fast unit tests (<1s), no external I/O or network dependencies.
    integration: Integration tests with real filesystem, FastAPI TestClient, or simulated pipelines.
    slow: Tests taking >5 seconds.
    gpu: Tests requiring CUDA or Apple Silicon MPS acceleration.
    network: Tests requiring external network/SFTP connectivity.
